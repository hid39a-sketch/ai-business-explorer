services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: abe
      POSTGRES_PASSWORD: abe  # ローカル開発専用。本番の認証情報には使わない
      POSTGRES_DB: ai_business_explorer
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abe -d ai_business_explorer"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
